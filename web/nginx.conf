server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}