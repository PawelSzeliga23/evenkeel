services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 2s
      timeout: 3s
      retries: 20

  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://portfolio:portfolio@db:5432/portfolio
      TEST_DATABASE_URL: postgresql+psycopg://portfolio:portfolio@db-test:5432/portfolio_test
      JWT_SECRET: ${JWT_SECRET:?Ustaw JWT_SECRET w pliku .env (skopiuj .env.example)}
      COOKIE_SECURE: "false"
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      INVITE_CODES: ${INVITE_CODES:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      WATCHFILES_FORCE_POLLING: "true"
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
      db-test:
        condition: service_healthy

  worker:
    build: ./api
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://portfolio:portfolio@db:5432/portfolio
      JWT_SECRET: ${JWT_SECRET:?Ustaw JWT_SECRET w pliku .env (skopiuj .env.example)}
      MARKET_DAILY_AT: ${MARKET_DAILY_AT:-23:00}
      PYTHONPATH: /app
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db-e2e:
    image: postgres:16
    profiles: ["e2e"]
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio_e2e
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio_e2e"]
      interval: 2s
      timeout: 3s
      retries: 20

  api-e2e:
    build: ./api
    profiles: ["e2e"]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://portfolio:portfolio@db-e2e:5432/portfolio_e2e
      JWT_SECRET: e2e-secret-that-is-at-least-32-bytes-long
      COOKIE_SECURE: "false"
      REGISTRATION_MODE: open
      PYTHONPATH: /app
    ports:
      - "8001:8000"
    volumes:
      - ./api:/app
    depends_on:
      db-e2e:
        condition: service_healthy

volumes:
  pgdata:
