services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 2s
      timeout: 3s
      retries: 20

  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://portfolio:portfolio@db:5432/portfolio
      TEST_DATABASE_URL: postgresql+psycopg://portfolio:portfolio@db-test:5432/portfolio_test
      JWT_SECRET: ${JWT_SECRET:?Ustaw JWT_SECRET w pliku .env (skopiuj .env.example)}
      COOKIE_SECURE: "false"
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      INVITE_CODES: ${INVITE_CODES:-}
      WATCHFILES_FORCE_POLLING: "true"
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
      db-test:
        condition: service_healthy

  worker:
    build: ./api
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://portfolio:portfolio@db:5432/portfolio
      JWT_SECRET: ${JWT_SECRET:?Ustaw JWT_SECRET w pliku .env (skopiuj .env.example)}
      MARKET_DAILY_AT: ${MARKET_DAILY_AT:-23:00}
      PYTHONPATH: /app
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
